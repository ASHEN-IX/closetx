services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: closetx
      POSTGRES_PASSWORD: closetx_dev_only
      POSTGRES_DB: closetx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: closetxlocal
      MINIO_ROOT_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
